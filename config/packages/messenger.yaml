framework:
    messenger:
        default_bus: command.bus

        buses:
            command.bus:
                middleware:
                    - doctrine_transaction
            event.bus:
                default_middleware:
                    enabled: true
                    allow_no_handlers: true
                middleware:
                    - doctrine_transaction

        transports:
            sync: 'sync://'
            async_doctrine: 'doctrine://default?queue_name=notifications'

        routing:
            # 1. Route the notification background tasks to the async database queue
            'App\Modules\Notifications\UseCases\SendEmailNotification\SendEmailNotificationCommand': async_doctrine

            # 2. Explicitly route the cross-module event to execute synchronously
            'App\Modules\Notifications\Api\Events\ResourceDeliveredEvent': sync
