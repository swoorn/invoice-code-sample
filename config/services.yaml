# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            # Permanent — never touched by this plan
            - '../src/Modules/Invoices/Domain/Entites/Product.php'
            - '../src/Modules/Invoices/Domain/ValueObjects/ProductName.php'
            - '../src/Modules/Invoices/Domain/ValueObjects/Quantity.php'
            - '../src/Modules/Invoices/Factories/ProductFactory.php'
            - '../src/Modules/Invoices/UseCases/CreateInvoice/SendInvoiceHandler.php'
            # Temporary — Task 6 fixes these and removes them from this list
            - '../src/Modules/Invoices/Domain/Entites/Invoice.php'
            - '../src/Modules/Invoices/Domain/Enums/StatusEnum.php'
            - '../src/Modules/Invoices/Domain/ValueObjects/CustomerEmail.php'
            - '../src/Modules/Invoices/Domain/ValueObjects/CustomerName.php'
            - '../src/Modules/Shared/Traits/DomainEvent.php'
            - '../src/Modules/Shared/Traits/DomainEventsTrait.php'
            - '../src/Modules/Shared/ValueObjects/Money.php'
            # Temporary — Task 10 fixes these and removes them from this list
            - '../src/Modules/Notifications/Api/Dtos/NotifyData.php'
            - '../src/Modules/Notifications/Api/Events/WebhookDeliveredEvent.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
